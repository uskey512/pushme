name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt
      - name: Show tool versions
        run: shellcheck --version && shfmt --version
      - run: make lint
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core
      # The suite runs bin/pushme with /bin/bash; on macOS that must be the
      # stock 3.2 for the matrix to prove bash 3.2 compatibility.
      - name: Check /bin/bash is 3.2
        if: runner.os == 'macOS'
        run: /bin/bash -c 'echo "$BASH_VERSION"; [ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2 ]'
      - run: make test

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the action list the commits of a pull request.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on pull requests would need write access.
          GITLEAKS_ENABLE_COMMENTS: "false"
